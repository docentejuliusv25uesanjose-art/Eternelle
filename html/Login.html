<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eternelle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Great+Vibes&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/login.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="corazon" viewBox="0 0 24 24"><path d="M12 21s-8.5-5.4-10-11C1 6 3.6 3 7 3c2 0 3.8 1.1 5 3 1.2-1.9 3-3 5-3 3.4 0 6 3 5 7-1.5 5.6-10 11-10 11z"/></symbol>
  </defs>
</svg>

<header>
  <a class="logo" href="login.html">
    <svg viewBox="0 0 64 58" fill="none" stroke="#e5192d" stroke-width="5" stroke-linejoin="round" aria-hidden="true">
      <path d="M32 54C14 42 4 32 4 20 4 11 11 5 19 5c6 0 10 3 13 8 3-5 7-8 13-8 8 0 15 6 15 15 0 12-10 22-28 34z"/>
      <path d="M32 40c-6-5-9-9-9-13 0-4 3-6 6-6 2 0 3 1 3 3 0-2 1-3 3-3 3 0 6 2 6 6 0 4-3 8-9 13z" fill="#7a1018" stroke="none"/>
    </svg>
    Eter<span>nelle</span>
  </a>
  <nav>
    <a href="login.html" class="activo" aria-label="Inicio">
      <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 3 2 12h3v8h5v-6h4v6h5v-8h3z"/></svg>
    </a>
    <a href="">Nuestra Historia</a>
    <a href="">Galería</a>
    <a href="">Razones</a>
  </nav>
  <a class="corazon-nav" href="#" aria-label="Favoritos">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M12 21s-8.5-5.4-10-11C1 6 3.6 3 7 3c2 0 3.8 1.1 5 3 1.2-1.9 3-3 5-3 3.4 0 6 3 5 7-1.5 5.6-10 11-10 11z"/></svg>
  </a>
</header>

<main>
  <!-- Corazones decorativos -->
  <svg class="flota" style="right:0.625rem;top:30%;width:3.75rem;height:3.75rem" viewBox="0 0 24 24"><use href="#corazon"/></svg>
  <svg class="flota" style="right:1.25rem;bottom:18%;width:5rem;height:5rem" viewBox="0 0 24 24"><use href="#corazon"/></svg>
  <svg class="flota" style="left:1.25rem;bottom:-1.25rem;width:4.375rem;height:4.375rem" viewBox="0 0 24 24"><use href="#corazon"/></svg>
  <svg class="flota" style="left:40%;bottom:-1.875rem;width:6.875rem;height:6.875rem" viewBox="0 0 24 24"><use href="#corazon"/></svg>

  <!-- Texto sobre la foto -->
  <section class="hero-texto">
    <h1>Nuestra historia…<span>apenas comienza</span></h1>
    <svg class="trazo" viewBox="0 0 520 140" fill="none" stroke="#ff3347" stroke-width="3" stroke-linecap="round" aria-hidden="true">
      <path d="M0 110C80 70 190 60 240 80c20 8 40-10 60-25 40-30 130-25 220-30"/>
      <path d="M240 78c-35-20-30-55-5-58 12-1 18 8 22 16 4-8 12-17 24-14 25 6 20 40-10 58" fill="rgba(255,51,71,.25)"/>
    </svg>
    <p class="frase">“Contigo, todo es mejor” <svg viewBox="0 0 24 24" fill="#e5192d"><use href="#corazon"/></svg></p>
  </section>

  <!-- Tarjeta de acceso -->
  <section class="login" aria-labelledby="titulo-login">
    <svg class="corazones" viewBox="0 0 190 130" fill="none" stroke="#e5192d" stroke-width="7" stroke-linejoin="round" aria-hidden="true">
      <path d="M70 118C28 90 6 66 6 42 6 22 22 8 42 8c12 0 22 6 28 16 6-10 16-16 28-16 20 0 36 14 36 34 0 24-22 48-64 76z"/>
      <path d="M126 122c-26-18-40-33-40-48 0-13 10-22 22-22 8 0 14 4 18 10 4-6 10-10 18-10 12 0 22 9 22 22 0 15-14 30-40 48z" stroke-width="6"/>
    </svg>
    <h2 id="titulo-login">Bienvenido a Eter<span>nelle</span></h2>
    <p class="sub">Inicia sesión para descubrir nuestra historia</p>

    <form id="form-login" autocomplete="on">
      <div class="campo">
        <svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4.4 0-8 2.2-8 5v3h16v-3c0-2.8-3.6-5-8-5z"/></svg>
        <input type="text" name="usuario" placeholder="Usuario o correo" aria-label="Usuario o correo" required>
      </div>

      <div class="campo">
        <svg viewBox="0 0 24 24"><path d="M17 9V7a5 5 0 0 0-10 0v2H5v13h14V9h-2zm-8-2a3 3 0 0 1 6 0v2H9V7zm3 10a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/></svg>
        <input type="password" id="clave" name="clave" placeholder="Contraseña" aria-label="Contraseña" required>
        <button type="button" class="ojo" id="ver-clave" aria-label="Mostrar contraseña">
          <svg viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></svg>
        </button>
      </div>

      <p class="error" id="error-login" role="alert" hidden>Usuario o contraseña incorrectos</p>

      <button type="submit" class="btn-entrar">
        <svg viewBox="0 0 24 24"><path d="M6 3l15 9-15 9z"/></svg>
        Iniciar Sesión
      </button>
    </form>

    <div class="separador" aria-hidden="true">
      <svg viewBox="0 0 24 24" stroke-linejoin="round"><path d="M12 21s-8.5-5.4-10-11C1 6 3.6 3 7 3c2 0 3.8 1.1 5 3 1.2-1.9 3-3 5-3 3.4 0 6 3 5 7-1.5 5.6-10 11-10 11z"/></svg>
    </div>
  </section>
</main>

<script>
  const USUARIO = "Valen";
  const CLAVE = "10/10/26";

  // Mostrar / ocultar contraseña
  const clave = document.getElementById("clave");
  document.getElementById("ver-clave").addEventListener("click", (e) => {
    const visible = clave.type === "text";
    clave.type = visible ? "password" : "text";
    e.currentTarget.setAttribute("aria-label", visible ? "Mostrar contraseña" : "Ocultar contraseña");
  });

  // Validar acceso y pasar a Historia
  const error = document.getElementById("error-login");

  document.getElementById("form-login").addEventListener("submit", (e) => {
    e.preventDefault();
    const usuario = e.target.usuario.value.trim();
    const pass = e.target.clave.value.trim();

    if (usuario.toLowerCase() === USUARIO.toLowerCase() && pass === CLAVE) {
      error.hidden = true;
      window.location.href = "historia.html";
    } else {
      error.hidden = false;
    }
  });
</script>
</body>
</html>
